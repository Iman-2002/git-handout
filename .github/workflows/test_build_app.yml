name: test-build-app

on:
  push:
    branches:
     #- main
     - HelloWorld
  pull_request:
    branches:
     # - main
     - HelloWorld
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: hello_flutter

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Code coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: hello_flutter/coverage/lcov.info

    # Uncomment für building APK, warning this takes a while
