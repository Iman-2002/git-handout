name: test-my-app

on:
  push:
    branches:
     # - main
      - HelloWorld
  pull_request:
    branches:
     # - main
      - HelloWorld
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: hello_flutter

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version

      - name: Install dependencies
        run: flutter pub get
        working-directory: hello_flutter

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: hello_flutter/build/app/outputs/flutter-apk/app-release.apk
